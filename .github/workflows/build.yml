name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      vllm_version:
        description: vLLM image tag to build on
        default: v0.27.1

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      VLLM_VERSION: ${{ inputs.vllm_version || 'v0.27.1' }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/vllm-openai-ssh
    steps:
      - uses: actions/checkout@v4

      # The vLLM base image is far larger than a runner's free disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker system prune -af
          df -h /

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker build --build-arg VLLM_VERSION="$VLLM_VERSION" -t "$IMAGE:$VLLM_VERSION" .
          docker run --rm --entrypoint /usr/sbin/sshd "$IMAGE:$VLLM_VERSION" -V 2>&1 | head -1
          docker push "$IMAGE:$VLLM_VERSION"
